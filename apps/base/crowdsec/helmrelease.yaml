apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: base-crowdsec
  namespace: flux-system
  annotations:
    homelab.wahoo.li/base-helmrelease: crowdsec
spec:
  releaseName: base-crowdsec
  targetNamespace: crowdsec
  chart:
    spec:
      chart: crowdsec
      sourceRef:
        kind: HelmRepository
        name: crowdsec
        namespace: flux-system
      interval: 24h
  install:
    timeout: 5m
    remediation:
      retries: -1
  upgrade:
    remediation:
      remediateLastFailure: true
  # The chart hardcodes the LAPI Deployment's labels
  postRenderers:
  - kustomize:
      patches:
      - target:
          kind: Deployment
          labelSelector: type=lapi
        patch: |
          - op: add
            path: /metadata/labels/app.kubernetes.io~1name
            value: crowdsec
