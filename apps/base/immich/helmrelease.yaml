apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: base-immich
  namespace: flux-system
  annotations:
    homelab.wahoo.li/base-helmrelease: immich
spec:
  releaseName: base-immich
  targetNamespace: immich
  chart:
    spec:
      chart: immich
      sourceRef:
        kind: HelmRepository
        name: immich
        namespace: flux-system
      version: "0.13.4"
      interval: 24h
  interval: 5m
  install:
    timeout: 10m
    remediation:
      retries: -1
  valuesFrom:
  - kind: ConfigMap
    name: immich-values
    valuesKey: values-base.yaml
