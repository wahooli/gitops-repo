apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- namespace.yaml
- helmrelease.yaml
- helmrepository.yaml
- imagerepository-immich-server.yaml
- imagerepository-patroni-17-vchord.yaml
- imagepolicy-immich-server.yaml
- imagepolicy-patroni-17-vchord.yaml
configMapGenerator:
- name: immich-values
  namespace: flux-system
  files:
  - values-base.yaml=values-base.yaml
  options:
    labels:
      velero.io/exclude-from-backup: "true"
