ServerRoot "/usr/local/apache2"
ServerName localhost
Listen 8080
DefaultRuntimeDir /tmp
PidFile /tmp/httpd.pid

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule authn_core_module modules/mod_authn_core.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule auth_basic_module modules/mod_auth_basic.so
LoadModule ldap_module modules/mod_ldap.so
LoadModule authnz_ldap_module modules/mod_authnz_ldap.so
LoadModule dav_module modules/mod_dav.so
LoadModule dav_fs_module modules/mod_dav_fs.so

StartServers 1
ServerLimit 2
ThreadsPerChild 16
MaxRequestWorkers 32
MinSpareThreads 8
MaxSpareThreads 32

ErrorLog /proc/self/fd/2
LogLevel warn
LogFormat "%a %u \"%r\" %>s %b %D" dav
CustomLog /proc/self/fd/1 dav

Timeout 300
LDAPConnectionTimeout 5
LDAPCacheTTL 300
LDAPOpCacheTTL 300
DAVLockDB /tmp/DAVLock
DavDepthInfinity On

DocumentRoot "/data"

<Directory "/">
  AllowOverride None
  Require all denied
</Directory>

<Directory "/data">
  Options None
  AllowOverride None
</Directory>

<Location "/">
  DAV On
  AuthType Basic
  AuthName "WebDAV"
  AuthBasicProvider ldap
  AuthLDAPURL "ldap://ak-outpost-authentik-ldap-outpost.authentik.svc.cluster.local.:389/dc=dav,dc=goauthentik,dc=io?cn?sub?(&(memberOf=cn=DAV Users,ou=groups,dc=dav,dc=goauthentik,dc=io)(ak-active=TRUE))"
  AuthLDAPBindDN "cn=dav-ldap-bind-user,ou=users,dc=dav,dc=goauthentik,dc=io"
  AuthLDAPBindPassword "exec:/bin/cat /run/secrets/webdav/password"
  Require all denied
</Location>

<LocationMatch "^/(?<owner>[^/]+)">
  <RequireAll>
    Require expr "%{REMOTE_USER} == %{env:MATCH_OWNER}"
    Require expr "-z %{req:Destination} || (%{req:Destination} =~ m#^https?://[^/]+/([^/]+)/# && $1 == %{REMOTE_USER} && !(%{req:Destination} =~ m#/\.\.?(/|$)|%2e|%2f|%5c#i))"
  </RequireAll>
</LocationMatch>
