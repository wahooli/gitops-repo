apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- namespace.yaml
- deployment.yaml
- service.yaml
- imagerepository.yaml
configMapGenerator:
- name: webdav-config
  namespace: webdav
  files:
  - httpd.conf=config/httpd.conf
  options:
    labels:
      velero.io/exclude-from-backup: "true"
