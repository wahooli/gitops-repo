apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- deployment.yaml
- service.yaml
- imagerepository.yaml
configMapGenerator:
- name: radicale-config
  namespace: webdav
  files:
  - config=config/config
  - rights=config/rights
  options:
    labels:
      velero.io/exclude-from-backup: "true"
