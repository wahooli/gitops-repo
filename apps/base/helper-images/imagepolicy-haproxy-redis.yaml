apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: haproxy-redis
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: haproxy-redis
  digestReflectionPolicy: IfNotPresent
  filterTags:
    pattern: '^\d+\.\d+\.\d+-\d+$'
  policy:
    semver:
      range: "~3.2.0-0"
