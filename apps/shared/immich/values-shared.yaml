immich:
  persistence:
    library:
      existingClaim: immich-library

machine-learning:
  enabled: false

valkey:
  enabled: true
  controllers:
    main:
      pod:
        securityContext:
          runAsNonRoot: true
          runAsUser: 999
          runAsGroup: 999
          fsGroup: 999
          fsGroupChangePolicy: OnRootMismatch
      containers:
        main:
          resources:
            requests:
              cpu: "0"
              memory: 32Mi
            limits:
              memory: 128Mi

server:
  controllers:
    main:
      strategy: Recreate
      annotations:
        configmap.reloader.stakater.com/reload: "syncthing-config"
        secret.reloader.stakater.com/reload: "syncthing-keys"
      pod:
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
      containers:
        main:
          image:
            tag: v3.3.0 # {"$imagepolicy": "flux-system:immich-server:tag"}
          env:
            DB_HOSTNAME: immich-patroni-proxy.immich.svc.cluster.local
            DB_USERNAME: immich
            DB_DATABASE_NAME: immich
            DB_PASSWORD: ${immich_database_password}
            DB_SSL_MODE: require
            DB_VECTOR_EXTENSION: vectorchord
          resources:
            requests:
              cpu: "0"
              memory: 512Mi
            limits:
              memory: 2Gi
        syncthing:
          image:
            repository: docker.io/syncthing/syncthing
            tag: 2.1.6 # {"$imagepolicy": "flux-system:syncthing:tag"}
          command:
          - /bin/sh
          - -c
          - |
            cp /syncthing-src/config.xml "$STHOMEDIR/config.xml"
            cp /syncthing-src/cert.pem "$STHOMEDIR/cert.pem"
            cp /syncthing-src/key.pem "$STHOMEDIR/key.pem"
            mkdir -p /data/.stfolder
            write_ignores() {
              want=""
              if [ "$SYNC_CURRENT_YEAR_ONLY" = "true" ]; then
                want="$(printf '!/library/*/%s\n/library/*/*' "$(date +%Y)")"
              fi
              [ "$(cat /data/.stignore 2>/dev/null)" = "$want" ] || printf '%s\n' "$want" >/data/.stignore
            }
            write_ignores
            (while sleep 3600; do write_ignores; done) &
            exec /bin/entrypoint.sh /bin/syncthing serve
          env:
            STGUIADDRESS: "0.0.0.0:8384"
            STHOMEDIR: /syncthing
            SYNC_CURRENT_YEAR_ONLY: "false"
            GOMAXPROCS: "2"
          ports:
          - name: sync
            containerPort: 22000
            protocol: TCP
          resources:
            requests:
              cpu: "0"
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 1Gi
  persistence:
    syncthing-config:
      type: configMap
      name: syncthing-config
      advancedMounts:
        main:
          syncthing:
          - path: /syncthing-src/config.xml
            subPath: config.xml
            readOnly: true
    syncthing-keys:
      type: secret
      name: syncthing-keys
      advancedMounts:
        main:
          syncthing:
          - path: /syncthing-src/cert.pem
            subPath: cert.pem
            readOnly: true
          - path: /syncthing-src/key.pem
            subPath: key.pem
            readOnly: true
    syncthing-data:
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      size: 4Gi
      retain: true
      advancedMounts:
        main:
          syncthing:
          - path: /syncthing
