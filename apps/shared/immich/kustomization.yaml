apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base/immich
- backend.yaml
- httproute-public.yaml
- httproute-private.yaml
- securitypolicy-private.yaml
patches:
- path: helmrelease.yaml
  target:
    kind: HelmRelease
    name: base-immich
  options:
    allowNameChange: true
configMapGenerator:
- name: immich-values
  namespace: flux-system
  behavior: merge
  files:
  - values-shared.yaml=values-shared.yaml
  options:
    labels:
      velero.io/exclude-from-backup: "true"
- name: syncthing-config
  namespace: immich
  options:
    disableNameSuffixHash: true
  files:
  - config.xml=syncthing-config.xml
configurations:
- ../../.config/valuesFrom.yaml
