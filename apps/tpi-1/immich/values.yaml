server:
  controllers:
    main:
      containers:
        main:
          env:
            IMMICH_WORKERS_INCLUDE: api
            IMMICH_IGNORE_MOUNT_CHECK_ERRORS: "true"
        syncthing:
          env:
            SYNC_CURRENT_YEAR_ONLY: "true"
  service:
    main:
      annotations:
        service.cilium.io/global: "true"
        service.cilium.io/affinity: "remote"
