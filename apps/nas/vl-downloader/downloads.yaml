apiVersion: v1
kind: PersistentVolume
metadata:
  name: vl-downloader-downloads
  labels:
    app.kubernetes.io/name: vl-downloader
spec:
  capacity:
    storage: 1Ti
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: ${vl_downloader_downloads_host_path}
    type: DirectoryOrCreate
  claimRef:
    namespace: default
    name: vl-downloader-downloads
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vl-downloader-downloads
  namespace: default
  labels:
    app.kubernetes.io/name: vl-downloader
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: ""
  volumeName: vl-downloader-downloads
  resources:
    requests:
      storage: 1Ti
