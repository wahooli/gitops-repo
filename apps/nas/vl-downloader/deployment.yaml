apiVersion: apps/v1
kind: Deployment
metadata:
  name: vl-downloader
  namespace: default
  labels:
    app.kubernetes.io/name: vl-downloader
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vl-downloader
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vl-downloader
    spec:
      containers:
      - name: vl-downloader
        image: docker.io/raiper34/vl-downloader:1.0.0 # {"$imagepolicy": "flux-system:vl-downloader:tag"}
        imagePullPolicy: IfNotPresent
        env:
        - name: TZ
          value: Europe/Helsinki
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        volumeMounts:
        - name: downloads
          mountPath: /vl-downloader/backend/downloads
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 15
          failureThreshold: 6
        livenessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
          failureThreshold: 3
      volumes:
      - name: downloads
        persistentVolumeClaim:
          claimName: vl-downloader-downloads
