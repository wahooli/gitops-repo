apiVersion: apps/v1
kind: Deployment
metadata:
  name: vl-downloader
  namespace: default
  labels:
    app.kubernetes.io/name: vl-downloader
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vl-downloader
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vl-downloader
        homelab.wahoo.li/vpn-client: "true"
    spec:
      containers:
      - name: vl-downloader
        image: 1.0.3 # {"$imagepolicy": "flux-system:vl-downloader:tag"}
        imagePullPolicy: IfNotPresent
        env:
        - name: TZ
          value: Europe/Helsinki
        - name: VIMM_SOLVER_URL
          value: http://byparr:8191/v1
        - name: VIMM_OUTPUT
          value: /downloads
        - name: VIMM_THROTTLE
          value: "3"
        - name: VIMM_LOG_LEVEL
          value: info
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        volumeMounts:
        - name: downloads
          mountPath: /downloads
        resources:
          # Headroom for 7z decompression + checksum hashing of multi-GB ROMs.
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "2"
            memory: 2Gi
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 15
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 15
          periodSeconds: 30
          failureThreshold: 3
      volumes:
      - name: downloads
        persistentVolumeClaim:
          claimName: vl-downloader-downloads
