image:
  tag: "v1.10.0" # {"$imagepolicy": "flux-system:ps3netsrv:tag"}

strategy:
  type: Recreate # needed for hostnetwork deployment

progressDeadlineSeconds: 600

global:
  labels:
    app.kubernetes.io/part-of: ps3netsrv

hostNetwork: true

persistence:
  games:
    enabled: true
    mount:
    - path: /games
    spec:
      hostPath:
        path: ${ps3netsrv_games_host_path}
        type: Directory
resources:
  requests:
    memory: 32Mi
  limits:
    memory: 256Mi
