apiVersion: apps/v1
kind: Deployment
metadata:
  name: jdownloader
  namespace: default
  labels:
    app.kubernetes.io/name: jdownloader
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: jdownloader
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jdownloader
      annotations:
        backup.velero.io/backup-volumes: config
    spec:
      containers:
      - name: jdownloader
        image: docker.io/jlesage/jdownloader-2:v26.09.1 # {"$imagepolicy": "flux-system:jdownloader:tag"}
        imagePullPolicy: IfNotPresent
        env:
        - name: USER_ID
          value: "2009"
        - name: GROUP_ID
          value: "2000"
        - name: TZ
          value: Europe/Helsinki
        - name: KEEP_APP_RUNNING
          value: "1"
        ports:
        - name: http
          containerPort: 5800
          protocol: TCP
        volumeMounts:
        - name: config
          mountPath: /config
        - name: downloads
          mountPath: /output
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: "2"
            memory: 2Gi
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 15
          failureThreshold: 6
        livenessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
          failureThreshold: 3
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: jdownloader-config
      - name: downloads
        persistentVolumeClaim:
          claimName: jdownloader-downloads
