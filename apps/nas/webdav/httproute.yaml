apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: webdav
  namespace: webdav
spec:
  parentRefs:
  - name: envoy-gw-private
    namespace: envoy-gateway-system
    sectionName: wahooli-https
  hostnames:
  - "webdav.${domain_wahoo_li:=wahoo.li}"
  rules:
  - backendRefs:
    - name: webdav
      port: 80
    timeouts:
      request: 600s
      backendRequest: 600s
