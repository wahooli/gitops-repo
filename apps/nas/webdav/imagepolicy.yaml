apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: httpd
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: httpd
  filterTags:
    pattern: '^(?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)$'
    extract: '$major.$minor.$patch'
  policy:
    semver:
      range: '>=2.4.0 <2.5.0'
