apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base/webdav
- volume.yaml
- secret.yaml
- httproute.yaml
- networkpolicy.yaml
- imagepolicy.yaml
images:
- name: httpd
  newTag: 2.4.69 # {"$imagepolicy": "flux-system:httpd:tag"}
patches:
- patch: |
    apiVersion: v1
    kind: Service
    metadata:
      name: webdav
      namespace: webdav
      annotations:
        service.cilium.io/global: "true"
        service.cilium.io/affinity: "local"
        service.cilium.io/global-sync-endpoint-slices: "true"
