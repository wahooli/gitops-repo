apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../shared/immich
- patroni
- library.yaml
- immich-syncthing-local.yaml
- immich-syncthing-remote.yaml
configMapGenerator:
- name: immich-values
  namespace: flux-system
  behavior: merge
  files:
  - values.yaml=values.yaml
  options:
    labels:
      velero.io/exclude-from-backup: "true"
configurations:
- ../../.config/valuesFrom.yaml
