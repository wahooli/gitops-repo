apiVersion: v1
kind: Service
metadata:
  name: immich-syncthing-nas
  namespace: immich
  annotations:
    service.cilium.io/global: "true"
    service.cilium.io/affinity: "local"
spec:
  type: ClusterIP
  ports:
  - name: sync
    port: 22000
    targetPort: 22000
  selector:
    app.kubernetes.io/instance: immich
    app.kubernetes.io/name: server
