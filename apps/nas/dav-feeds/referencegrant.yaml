apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: webdav-to-authentik-outpost
  namespace: default
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: webdav
  - group: gateway.envoyproxy.io
    kind: SecurityPolicy
    namespace: webdav
  to:
  - group: ""
    kind: Service
    name: ak-outpost-nasse-proxy
