apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dav-feeds
  namespace: webdav
spec:
  parentRefs:
  - name: envoy-gw-private
    namespace: envoy-gateway-system
    sectionName: wahooli-https
  hostnames:
  - "dav-feeds.${domain_wahoo_li:=wahoo.li}"
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: ak-outpost-nasse-proxy
      namespace: default
      port: 9000
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /outpost.goauthentik.io
  - backendRefs:
    - group: ""
      kind: Service
      name: dav-feeds
      port: 8080
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: dav-feeds-auth
  namespace: webdav
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: dav-feeds
  extAuth:
    failOpen: false
    headersToExtAuth:
    - cookie
    - authorization
    - proxy-authorization
    - x-forwarded-for
    - x-forwarded-proto
    - x-real-ip
    - accept
    http:
      backendRefs:
      - name: ak-outpost-nasse-proxy
        namespace: default
        port: 9000
      path: /outpost.goauthentik.io/auth/envoy
      headersToBackend:
      - set-cookie
      - x-authentik-username
      - x-authentik-uid
      - x-authentik-name
      - x-authentik-email
      - x-authentik-groups
      - x-authentik-entitlements
      - x-authentik-jwt
