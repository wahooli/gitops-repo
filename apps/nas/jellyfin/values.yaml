envFrom:
  envs:
    type: configMap
    useFromChart: false
    name: jellyfin-env
strategy:
  type: Recreate
image:
  tag: "10.11.11" # {"$imagepolicy": "flux-system:jellyfin:tag"}
podAnnotations:
  backup.velero.io/backup-volumes: data
  secret.reloader.stakater.com/reload: "jellyfin-ldap-auth"
runtimeClassName: nvidia
initContainers:
  ldap-auth-config:
    image: busybox:1.37
    imagePullPolicy: IfNotPresent
    command: ["sh", "-c", "mkdir -p /config/plugins/configurations && cp /ldap-auth/LDAP-Auth.xml /config/plugins/configurations/LDAP-Auth.xml"]
    volumeMounts:
    - name: data
      mountPath: /config
      subPath: config
    - name: ldap-auth
      mountPath: /ldap-auth
      readOnly: true
    resources:
      requests:
        memory: 16Mi
      limits:
        memory: 32Mi
# hostNetwork: true
dnsConfig:
  options:
  - name: ndots
    value: "1"
  - name: edns0
global:
  labels:
    backupWeekly: "true"
    backupDaily: "true"
    app.kubernetes.io/part-of: jellyfin
service:
  main:
    annotations:
      service.cilium.io/global: "true"
      service.cilium.io/affinity: "local"
      service.cilium.io/global-sync-endpoint-slices: "true"
persistence:
  data:
    enabled: true
    mount:
    - path: /config
      subPath: config
    - path: /cache
      subPath: cache
    spec:
      isPersistentVolumeClaim: true
      accessModes:
      - "ReadWriteOnce"
      resources:
        requests:
          storage: "60Gi"
  config:
    enabled: true
    mount:
    - path: /config/config/logging.json
      subPath: logging.json
    spec:
      useFromChart: false
      configMap:
        name: jellyfin-config
  ldap-auth:
    enabled: true
    spec:
      useFromChart: false
      secret:
        name: jellyfin-ldap-auth
  movies:
    enabled: true
    mount:
    - path: /data/Movies
    spec:
      hostPath:
        path: ${jellyfin_movies_host_path}
        type: Directory
  tv:
    enabled: true
    mount:
    - path: /data/Series
    spec:
      hostPath:
        path: ${jellyfin_tv_host_path}
        type: Directory
  transcode:
    enabled: true
    mount:
    - path: /transcode
    spec:
      emptyDir:
        sizeLimit: 20Gi
        medium: Memory
ingress:
  main:
    enabled: false

progressDeadlineSeconds: 600
resources:
  requests:
    memory: 1536Mi
  limits:
    memory: 4Gi
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 2005
  runAsGroup: 2000
  fsGroup: 2000
  fsGroupChangePolicy: OnRootMismatch
