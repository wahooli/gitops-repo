image:
  repository: ghcr.io/home-operations/bazarr
  tag: "1.6.2" # {"$imagepolicy": "flux-system:bazarr:tag"}
progressDeadlineSeconds: 600
podAnnotations:
  backup.velero.io/backup-volumes: config
  vector.dev/exclude-containers: "bazarr-exporter"
strategy:
  type: Recreate
dnsConfig:
  options:
  - name: ndots
    value: "1"
  - name: edns0
global:
  labels:
    backupWeekly: "true"
    backupDaily: "true"
    app.kubernetes.io/part-of: bazarr
metrics:
  enabled: true
  # dockerModsUrl: ghcr.io/linuxserver/mods
  extraEnv:
    ENABLE_ADDITIONAL_METRICS: "true"
  resources:
    limits:
      cpu: 150m
      memory: 160Mi
    requests:
      cpu: "0"
      memory: 96Mi
serviceMonitor:
  create: true
  jobLabel: app.kubernetes.io/name
  endpoint:
    interval: 300s # additional metrics makes scraping slow, and here's not that time sensitive data anyway
    scrapeTimeout: 60s
    metricRelabelConfigs:
    - action: replace
      replacement: nasse
      target_label: instance
    - action: labeldrop
      regex: (pod|container|image_id|url|endpoint|namespace|prometheus)
envFrom:
  envs:
    type: configMap
    useFromChart: false
    name: bazarr-env
# resources:
#   requests:
#     memory: "256Mi"
#     cpu: "400m"
#   limits:
#     memory: "3072Mi"
#     cpu: "1000m"
persistence:
  config:
    enabled: true
    mount:
    - path: /config
    spec:
      isPersistentVolumeClaim: true
      accessModes:
      - "ReadWriteOnce"
      resources:
        requests:
          storage: "1Gi"
  movies:
    enabled: true
    mount:
    - path: /movies
    spec:
      hostPath:
        path: ${bazarr_movies_host_path}
        type: Directory
  tv:
    enabled: true
    mount:
    - path: /tv
    spec:
      hostPath:
        path: ${bazarr_tv_host_path}
        type: Directory
service:
  main:
    annotations:
      service.cilium.io/global: "true"
      service.cilium.io/affinity: "local"
ingress:
  main:
    enabled: false
resources:
  requests:
    memory: 640Mi
  limits:
    memory: 1Gi
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 2003
  runAsGroup: 2000
  fsGroup: 2000
  fsGroupChangePolicy: OnRootMismatch
sidecars:
  apikey-sync:
    image:
      repository: ghcr.io/home-operations/bazarr
      tag: "1.6.2" # {"$imagepolicy": "flux-system:bazarr:tag"}
    command:
    - /bin/sh
    - -c
    - |
      CFG=/src/config.yaml; OUT=/shared/apikey
      while :; do
        if [ -f "$CFG" ]; then
          KEY=$(awk '/^auth:/{a=1;next} /^[^[:space:]#]/{a=0} a && $1=="apikey:"{v=$2; gsub(/["\047]/,"",v); print v; exit}' "$CFG")
          if [ -n "$KEY" ] && [ "$KEY" != "$(cat "$OUT" 2>/dev/null)" ]; then
            printf '%s' "$KEY" > "$OUT.tmp" && chmod 0644 "$OUT.tmp" && mv -f "$OUT.tmp" "$OUT" && echo "apikey file updated"
          fi
        fi
        sleep 30
      done
    volumeMounts:
    - name: config
      mountPath: /src
      subPath: config
      readOnly: true
    - name: config
      mountPath: /shared
      subPath: shared
    resources:
      requests:
        cpu: "0"
        memory: 8Mi
      limits:
        memory: 32Mi
