apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: radicale-data
  namespace: webdav
  labels:
    app.kubernetes.io/name: radicale
    backupDaily: "true"
    backupWeekly: "true"
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: topolvm-default
  resources:
    requests:
      storage: 1Gi
