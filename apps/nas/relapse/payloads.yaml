apiVersion: v1
kind: PersistentVolume
metadata:
  name: relapse-payloads
  labels:
    app.kubernetes.io/name: relapse
spec:
  capacity:
    storage: 1Gi
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: ${relapse_payloads_host_path}
    type: DirectoryOrCreate
  claimRef:
    namespace: relapse
    name: relapse-payloads
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: relapse-payloads
  namespace: relapse
  labels:
    app.kubernetes.io/name: relapse
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: ""
  volumeName: relapse-payloads
  resources:
    requests:
      storage: 1Gi
