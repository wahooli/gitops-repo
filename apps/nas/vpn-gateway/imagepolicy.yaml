apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: vpn-gateway
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: vpn-gateway
  filterTags:
    pattern: '^v?(?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)$'
    extract: '$major.$minor.$patch'
  policy:
    semver:
      range: '>=0.1.0'
