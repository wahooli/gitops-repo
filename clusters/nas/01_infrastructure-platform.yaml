apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-platform
  namespace: flux-system
spec:
  interval: 5m0s
  prune: true
  dependsOn:
  - name: infrastructure-core
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/platform/nas
  healthChecks:
  - apiVersion: policies.kyverno.io/v1
    kind: MutatingPolicy
    name: vpn-gateway-client
  healthCheckExprs:
  - apiVersion: policies.kyverno.io/v1
    kind: MutatingPolicy
    current: has(status.conditionStatus) && status.conditionStatus.ready == true
  postBuild:
    substituteFrom:
    - kind: Secret
      name: cluster-infrastructure-vars
      optional: false
    - kind: Secret
      name: cluster-vars
      optional: true
    - kind: Secret
      name: dns-vars
      optional: true
