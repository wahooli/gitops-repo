name: End to end test

on:
  workflow_dispatch:
    inputs:
      cluster:
        description: 'Comma-separated list of directories to run reconcile against'
        default: 'vm'
        required: true
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
  push:
    branches:
    - '*'
    tags-ignore:
    - '*'
    paths-ignore:
    - 'charts/**'
    - 'inventory/**'
    - 'githooks/**'
    - '*.md'
    - 'LICENSE'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-check:
    name: Check for open pull request
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      has_pr: ${{ steps.pr.outputs.has_pr }}
    steps:
    - name: Find open pull request for branch
      id: pr
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        count=$(gh pr list --repo "${GITHUB_REPOSITORY}" --head "${GITHUB_REF_NAME}" --state open --json number --jq length)
        if [ "${count}" -gt 0 ]; then
          echo "Open pull request found for ${GITHUB_REF_NAME}, pull_request event will run the tests"
          echo "has_pr=true" >> "${GITHUB_OUTPUT}"
        else
          echo "has_pr=false" >> "${GITHUB_OUTPUT}"
        fi

  lint:
    name: Lint YAML and get modified helmreleases
    runs-on: ubuntu-latest
    needs: pr-check
    if: ${{ !cancelled() && needs.pr-check.outputs.has_pr != 'true' }}
    outputs:
      matrix: ${{ steps.helmreleases.outputs.test_matrix || steps.clusters.outputs.test_matrix }}
    steps:
    - name: Install git, yamllint, wget, curl and yq
      if: runner.environment == 'self-hosted'
      run: |
        sudo apt-get update -qqy
        sudo apt-get install git yamllint curl wget -qqy --no-install-recommends
        sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq
        sudo chmod a+x /usr/bin/yq
    - name: Setup Flux
      if: github.event_name != 'workflow_dispatch'
      uses: fluxcd/flux2/action@main
    - name: Checkout
      uses: actions/checkout@v7.0.1
    - name: 🚀 Run yamllint
      run: |
        yamllint -s -c .yamllint .
    - name: Get changed directories
      id: changed-directories
      if: github.event_name != 'workflow_dispatch'
      uses: tj-actions/changed-files@v47.0.6
      with:
        dir_names_exclude_current_dir: true
        files: |
          apps/**/*
          infrastructure/**/*
          clusters/**/*
        files_ignore: |
          *.md
          **/ci-excluded/**
          apps/.config/*
    - name: Get changed helmreleases
      if: github.event_name != 'workflow_dispatch'
      id: helmreleases
      env:
        FILES: "${{ steps.changed-directories.outputs.all_changed_files }}"
      run: scripts/ci/get-changed-helmreleases.sh
    - name: Define test matrix
      if: github.event_name == 'workflow_dispatch'
      id: clusters
      run: |
        scripts/ci/parse-workflow-dispatch-input.sh "${{ inputs.cluster }}"

  kubernetes:
    runs-on: ubuntu-latest
    needs: lint
    name: Test flux reconciliation for ${{ matrix.test.tenant }}
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.lint.outputs.matrix ) }}
    if: ${{ !cancelled() && needs.lint.result == 'success' && needs.lint.outputs.matrix != '[]' && needs.lint.outputs.matrix != '' }}
    steps:
    - name: Get more disk space
      uses: jlumbroso/free-disk-space@v2.0.0
      with:
        preinstalled-runtimes: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        swap-storage: false
        docker-images: false
    - name: Checkout
      uses: actions/checkout@v7.0.1
      with:
        sparse-checkout: |
          scripts/ci/
          .github/workflows
          apps
          crds
          clusters
          infrastructure
          local-clusters
          scripts
          .sourceignore
    - name: Install required self-hosted dependencies
      if: runner.environment == 'self-hosted'
      run: |
        sudo apt-get update -qqy
        sudo apt-get install git curl wget jq openssl -qqy --no-install-recommends
        curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash
        curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
        sudo wget -qO /usr/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
        sudo chmod +x /usr/bin/yq
        CILIUM_CLI_VERSION=$(curl -s https://raw.githubusercontent.com/cilium/cilium-cli/main/stable.txt)
        curl -sL --fail https://github.com/cilium/cilium-cli/releases/download/${CILIUM_CLI_VERSION}/cilium-linux-amd64.tar.gz | sudo tar xz -C /usr/local/bin
    - name: Install tools
      if: runner.environment != 'self-hosted'
      run: |
        curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash
        curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
        sudo wget -qO /usr/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
        sudo chmod +x /usr/bin/yq
        CILIUM_CLI_VERSION=$(curl -s https://raw.githubusercontent.com/cilium/cilium-cli/main/stable.txt)
        curl -sL --fail https://github.com/cilium/cilium-cli/releases/download/${CILIUM_CLI_VERSION}/cilium-linux-amd64.tar.gz | sudo tar xz -C /usr/local/bin
    - name: Setup Flux
      uses: fluxcd/flux2/action@main
      with:
        version: '${{ matrix.test.flux_version }}'
    - name: Kyverno policy check
      env:
        KYVERNO_VERSION: v1.19.1
      run: scripts/ci/kyverno-check.sh ${{ matrix.test.tenant }}
    - name: Create k3d cluster
      id: create-cluster
      continue-on-error: true
      env:
        K3D_SERVERS: "1"
        K3D_AGENTS: "0"
        MINIMAL_REQUESTS: "true"
      run: scripts/create-cluster.sh ${{ matrix.test.tenant }}
    - name: Patch manifests for CI
      if: steps.create-cluster.outcome == 'success'
      run: scripts/ci/patch-manifests.sh
    - name: Bootstrap Flux
      if: steps.create-cluster.outcome == 'success'
      run: scripts/bootstrap-flux.sh ${{ matrix.test.tenant }}
    - name: Verify kustomization reconciliation
      if: steps.create-cluster.outcome == 'success'
      env:
        TENANT: "${{ matrix.test.tenant }}"
        CONTEXT: "k3d-${{ matrix.test.tenant }}"
        RECONCILE_READY: "false"
      run: scripts/verify-kustomizations.sh
    - name: Verify helmrelease reconciliation
      if: steps.create-cluster.outcome == 'success'
      id: helmrelease-verify
      env:
        HELM_RELEASES: "${{ join(matrix.test.helmreleases, ',') }}"
        TENANT: "${{ matrix.test.tenant }}"
        CONTEXT: "k3d-${{ matrix.test.tenant }}"
        RECONCILE_READY: "false"
      run: scripts/verify-helmreleases.sh
    - name: Verify blueprint apply
      if: steps.create-cluster.outcome == 'success'
      continue-on-error: true
      env:
        CONTEXT: "k3d-${{ matrix.test.tenant }}"
      run: scripts/verify-blueprint-apply.sh
    - name: Debug failure
      if: failure() && steps.create-cluster.outcome == 'success'
      env:
        DEBUG_LOGS: "true"
        DEBUG_NODES: "true"
        HELM_RELEASES: "${{ steps.helmrelease-verify.outputs.failing_helmrelease || join(matrix.test.helmreleases, ',') }}"
      run: scripts/ci/debug-failure.sh
