apiVersion: v1
kind: ResourceQuota
metadata:
  name: tenant
  namespace: ${tenant_name}
spec:
  hard:
    requests.cpu: "${tenant_quota_cpu:=4}"
    requests.memory: ${tenant_quota_memory:=8Gi}
    limits.memory: ${tenant_quota_memory_limit:=16Gi}
    requests.storage: ${tenant_quota_storage:=50Gi}
    persistentvolumeclaims: "${tenant_quota_pvcs:=10}"
    pods: "${tenant_quota_pods:=30}"
    services.loadbalancers: "0"
    services.nodeports: "0"
