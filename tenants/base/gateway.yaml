apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy-gw-${tenant_name}
  namespace: envoy-gateway-system
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  gatewayClassName: envoy-gateway
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: envoy-proxy-config
    annotations:
      external-dns.alpha.kubernetes.io/hostname: "*.${tenant_name}.${domain_wahoo_li:=wahoo.li}"
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    hostname: "*.${tenant_name}.${domain_wahoo_li:=wahoo.li}"
    allowedRoutes:
      namespaces:
        from: Same
  - name: https
    protocol: HTTPS
    port: 443
    hostname: "*.${tenant_name}.${domain_wahoo_li:=wahoo.li}"
    tls:
      mode: Terminate
      certificateRefs:
      - name: tenant-${tenant_name}-wildcard-tls
        kind: Secret
    allowedRoutes:
      namespaces:
        from: Selector
        selector:
          matchLabels:
            homelab.wahoo.li/tenant: ${tenant_name}
      kinds:
      - kind: HTTPRoute
      - kind: GRPCRoute
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: envoy-gw-${tenant_name}-https-redirect
  namespace: envoy-gateway-system
spec:
  parentRefs:
  - name: envoy-gw-${tenant_name}
    sectionName: http
  hostnames:
  - "*.${tenant_name}.${domain_wahoo_li:=wahoo.li}"
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
