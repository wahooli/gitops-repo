apiVersion: v1
kind: ServiceAccount
metadata:
  name: flux-reconciler
  namespace: ${tenant_name}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flux-reconciler
  namespace: ${tenant_name}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tenant
subjects:
- kind: ServiceAccount
  name: flux-reconciler
  namespace: ${tenant_name}
