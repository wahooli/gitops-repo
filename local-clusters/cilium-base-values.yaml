k8sServiceHost: 127.0.0.1
k8sServicePort: 6444
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
cni:
  exclusive: false
defaultLBServiceIPAM: none
localRedirectPolicy: true
clustermesh:
  cacheTTL: 15m
  useAPIServer: true
  config:
    enabled: true
  apiserver:
    service:
      type: LoadBalancer
  enableEndpointSliceSynchronization: true
hostServices:
  enabled: false
ipv6:
  enabled: false
ipam:
  mode: cluster-pool
operator:
  extraEnv:
  - name: KUBE_FEATURE_WatchListClient
    value: "false"
