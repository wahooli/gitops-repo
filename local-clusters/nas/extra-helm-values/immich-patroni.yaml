apiVersion: v1
kind: ConfigMap
metadata:
  name: immich-patroni-helmrelease-overrides
  namespace: flux-system
data:
  values.yaml: |
    secrets:
      etcd-client:
        enabled: false

    podAnnotations:
      secret.reloader.stakater.com/reload: "etcd-client,patroni-server"

    persistence:
      etcd-tls:
        spec:
          useFromChart: false
