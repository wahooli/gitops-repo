apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
spec:
  patches:
  - target:
      kind: InferenceService
    patch: |
      apiVersion: serving.kserve.io/v1beta1
      kind: InferenceService
      metadata:
        name: unused
      $patch: delete
  - target:
      labelSelector: homelab.wahoo.li/ai-workload=true
    patch: |
      apiVersion: v1
      kind: Unused
      metadata:
        name: unused
      $patch: delete
