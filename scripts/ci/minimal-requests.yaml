apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: minimal-requests
spec:
  failurePolicy: Ignore
  reinvocationPolicy: Never
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE"]
      resources: ["pods"]
  mutations:
  - patchType: JSONPatch
    jsonPatch:
      expression: >-
        object.spec.containers.filter(c, has(c.resources) && has(c.resources.requests) && "cpu" in c.resources.requests).map(c,
          JSONPatch{op: "replace", path: "/spec/containers/" + string(object.spec.containers.indexOf(c)) + "/resources/requests/cpu", value: "1m"})
  - patchType: JSONPatch
    jsonPatch:
      expression: >-
        has(object.spec.initContainers) ?
          object.spec.initContainers.filter(c, has(c.resources) && has(c.resources.requests) && "cpu" in c.resources.requests).map(c,
            JSONPatch{op: "replace", path: "/spec/initContainers/" + string(object.spec.initContainers.indexOf(c)) + "/resources/requests/cpu", value: "1m"})
        : []
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: minimal-requests
spec:
  policyName: minimal-requests
