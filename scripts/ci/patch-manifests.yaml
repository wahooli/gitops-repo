rules:
- description: Remove pod affinity rules (node affinity, pod anti-affinity, etc.)
  expression: |
    del(.. | select(has("affinity")).affinity)

- description: Remove topology spread constraints
  expression: |
    del(.. | select(has("topologySpreadConstraints")).topologySpreadConstraints)

- description: >-
    Remove CPU and memory requests/limits from container resources,
    while preserving PVC storage requests
  expression: |
    del(.. | select(has("resources")).resources.requests | select(has("cpu") or has("memory"))) |
    del(.. | select(has("resources")).resources.limits | select(has("cpu") or has("memory")))
  error_tolerant: true

- description: >-
    Minimal Kyverno CPU requests: with ours stripped, the chart defaults (4 x 100m)
    don't fit on the single CI node
  expression: |
    with(select(has("admissionController") and has("backgroundController") and has("cleanupController") and has("reportsController"));
      .admissionController.container.resources.requests.cpu = "1m" |
      .backgroundController.resources.requests.cpu = "1m" |
      .cleanupController.resources.requests.cpu = "1m" |
      .reportsController.resources.requests.cpu = "1m")
  error_tolerant: true

- description: >-
    VictoriaMetrics operator: no default resources for the CRs stripped above
    (operator defaults, e.g. vmstorage 250m CPU, don't fit on the single CI node)
  expression: |
    with(select(.kind == "HelmRelease" and .spec.chart.spec.chart == "victoria-metrics-operator");
      .spec.values.env += ([
        "VM_VLAGENTDEFAULT_USEDEFAULTRESOURCES",
        "VM_VLCLUSTERDEFAULT_USEDEFAULTRESOURCES",
        "VM_VLOGSDEFAULT_USEDEFAULTRESOURCES",
        "VM_VLSINGLEDEFAULT_USEDEFAULTRESOURCES",
        "VM_VMAGENTDEFAULT_USEDEFAULTRESOURCES",
        "VM_VMALERTDEFAULT_USEDEFAULTRESOURCES",
        "VM_VMALERTMANAGER_USEDEFAULTRESOURCES",
        "VM_VMANOMALYDEFAULT_USEDEFAULTRESOURCES",
        "VM_VMAUTHDEFAULT_USEDEFAULTRESOURCES",
        "VM_VMBACKUP_USEDEFAULTRESOURCES",
        "VM_VMCLUSTERDEFAULT_USEDEFAULTRESOURCES",
        "VM_VMSINGLEDEFAULT_USEDEFAULTRESOURCES"
      ] | map({"name": ., "value": "false"})))
  error_tolerant: true

- description: Disable blueprint-apply error sleep in CI
  expression: |
    with(select(.metadata.name == "authentik-apply-blueprints");
      .spec.template.spec.initContainers[] |= with(select(.name == "apply-blueprints");
        .env += [{"name": "BLUEPRINT_ERROR_SLEEP", "value": "0"}]))
  error_tolerant: true

- description: >-
    Keep Kyverno policies in Audit mode in CI: requests/limits are stripped above,
    so a cluster overlay that enforces (Deny) would reject every pod. Drops overlay
    patches targeting ValidatingPolicies, base policies are Audit. Matches on target,
    since patch-manifests.sh hides block scalar contents (patch: |) from the rules
  expression: |
    with(select(.kind == "Kustomization" and has("patches"));
      .patches |= map(select(.target.kind != "ValidatingPolicy")))
  error_tolerant: true

