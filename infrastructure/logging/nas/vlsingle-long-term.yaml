apiVersion: operator.victoriametrics.com/v1
kind: VLSingle
metadata:
  name: long-term-nas
  namespace: logging
spec:
  image:
    repository: victoriametrics/victoria-logs
    tag: v1.24.0-victorialogs # {"$imagepolicy": "flux-system:victoria-logs:tag"}
    pullPolicy: IfNotPresent
  retentionPeriod: "100y" # overridden by extraArg retention.maxDiskSpaceUsageBytes
  logFormat: json
  retentionMaxDiskSpaceUsageBytes: 100GiB
  extraArgs:
    storageDataPath: /storage
  resources:
    requests:
      cpu: 150m
      memory: 1Gi
    limits:
      cpu: 1200m
      memory: 4Gi
  serviceSpec:
    useAsDefault: true
    spec:
      type: ClusterIP
    metadata:
      annotations:
        service.cilium.io/global: "true"
  # Stays root until the existing data in the hostPath is chowned to 65534 on the host;
  # otherwise VM_ENABLESTRICTSECURITY would run it as 65534, which can't write there
  securityContext:
    runAsUser: 0
    runAsGroup: 0
    runAsNonRoot: false
  volumeMounts:
  - name: vlogsstorage-volume
    mountPath: /storage
  volumes:
  - name: vlogsstorage-volume
    hostPath:
      path: "${long_term_logs_cluster_directory_path}"
      type: "${long_term_logs_cluster_directory_type:=Directory}"
