image:
  tag: "9.20"

hostname: bind9

progressDeadlineSeconds: 600

args:
- -g
- '-4'
- -n 2
- -c
- /etc/bind/named.conf

resources:
  limits:
    memory: 512Mi
  requests:
    memory: 300Mi

    cpu: 10m
bind9:
  namedConfGenerator:
    enabled: true
  zoneCopy:
    enabled: true
    overwrite: false
