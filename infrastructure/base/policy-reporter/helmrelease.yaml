apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: base-policy-reporter
  namespace: flux-system
  annotations:
    homelab.wahoo.li/base-helmrelease: policy-reporter
spec:
  releaseName: base-policy-reporter
  targetNamespace: policy-reporter
  chart:
    spec:
      chart: policy-reporter
      sourceRef:
        kind: HelmRepository
        name: policy-reporter
        namespace: flux-system
      interval: 24h
  install:
    timeout: 5m
    remediation:
      retries: -1
  upgrade:
    remediation:
      remediateLastFailure: true
  valuesFrom:
  - kind: ConfigMap
    name: policy-reporter-values
    valuesKey: values-base.yaml
