crds:
  install: true
admissionController:
  replicas: 1
  container:
    resources:
      requests:
        cpu: "0"
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 384Mi
backgroundController:
  resources:
    requests:
      cpu: "0"
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
cleanupController:
  resources:
    requests:
      cpu: "0"
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
reportsController:
  resources:
    requests:
      cpu: "0"
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  rbac:
    clusterRole:
      extraResources:
      - apiGroups: ["gateway.networking.k8s.io"]
        resources: ["httproutes", "grpcroutes", "tlsroutes", "tcproutes", "udproutes"]
features:
  # Every Kyverno webhook fails open, so an unavailable admission controller can't
  # block pod creation on a single-node cluster. Whether a violation blocks is still
  # set per policy (failureAction / validationActions).
  forceFailurePolicyIgnore:
    enabled: true
  policyExceptions:
    enabled: true
    namespace: kyverno
