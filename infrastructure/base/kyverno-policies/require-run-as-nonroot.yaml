apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-run-as-nonroot
  annotations:
    policies.kyverno.io/title: Require runAsNonRoot
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Containers must be required to run as non-root users. This policy ensures
      runAsNonRoot resolves to true for every container, either set on the
      container itself or inherited from the pod securityContext.
spec:
  validationActions: [Audit]
  failurePolicy: Ignore
  autogen:
    podControllers:
      controllers:
      - deployments
      - statefulsets
      - daemonsets
      - jobs
      - cronjobs
  matchConstraints:
    namespaceSelector:
      matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: NotIn
        values: [kube-system, kyverno]
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["pods"]
  variables:
  - name: allContainers
    expression: >-
      object.spec.containers +
      object.spec.?initContainers.orValue([]) +
      object.spec.?ephemeralContainers.orValue([])
  - name: podRunAsNonRoot
    expression: object.spec.?securityContext.?runAsNonRoot.orValue(false)
  - name: rootContainers
    expression: >-
      variables.allContainers.filter(c,
        !(c.name in exceptions.allowedValues) &&
        !c.?securityContext.?runAsNonRoot.orValue(variables.podRunAsNonRoot))
  validations:
  - expression: size(variables.rootContainers) == 0
    messageExpression: >-
      'Running as root is not allowed. Set runAsNonRoot to true in the pod or container securityContext: ' +
      variables.rootContainers.map(c, c.name).join(', ')
