apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-image-registries
  annotations:
    policies.kyverno.io/title: Restrict Image Registries
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Images from unknown registries may not be scanned and could contain
      vulnerabilities or malicious code. This policy audits container images
      to ensure they come from trusted registries.
spec:
  validationActions: [Audit]
  failurePolicy: Ignore
  matchConstraints:
    # Kyverno's resourceFilters keep these out of admission checks, but not out of background scans
    namespaceSelector:
      matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: NotIn
        values: [kube-system, kyverno]
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["pods"]
  variables:
  - name: allContainers
    expression: >-
      object.spec.containers +
      object.spec.?initContainers.orValue([]) +
      object.spec.?ephemeralContainers.orValue([])
  # image() resolves Docker Hub short names (busybox, victoriametrics/vmagent) to index.docker.io
  - name: allowedRegistries
    expression: >-
      [
        'index.docker.io',
        'ghcr.io',
        'quay.io',
        'gcr.io',
        'registry.k8s.io',
        'reg.kyverno.io',
        'lscr.io',
        'code.forgejo.org',
        'registry.${domain_wahoo_li:=wahoo.li}',
        'registry.${domain_absolutist_it:=absolutist.it}'
      ]
  - name: untrustedContainers
    expression: >-
      variables.allContainers.filter(c, !(image(c.image).registry() in variables.allowedRegistries))
  validations:
  - expression: size(variables.untrustedContainers) == 0
    messageExpression: >-
      'Images must be from an allowed registry: ' +
      variables.untrustedContainers.map(c, c.name + ' (' + c.image + ')').join(', ')
