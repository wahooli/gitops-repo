apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-capabilities
  annotations:
    policies.kyverno.io/title: Disallow Capabilities
    policies.kyverno.io/category: Pod Security Standards (Baseline)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Adding capabilities beyond the Pod Security Standards baseline set, such
      as SYS_ADMIN or NET_ADMIN, gives a container powers close to root on the
      node. This policy ensures containers only add capabilities from the
      baseline set.
spec:
  validationActions: [Audit]
  failurePolicy: Ignore
  matchConstraints:
    namespaceSelector:
      matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: NotIn
        values: [kube-system, kyverno]
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["pods"]
  variables:
  - name: allContainers
    expression: >-
      object.spec.containers +
      object.spec.?initContainers.orValue([]) +
      object.spec.?ephemeralContainers.orValue([])
  - name: allowedCapabilities
    expression: >-
      ['AUDIT_WRITE', 'CHOWN', 'DAC_OVERRIDE', 'FOWNER', 'FSETID', 'KILL', 'MKNOD',
       'NET_BIND_SERVICE', 'SETFCAP', 'SETGID', 'SETPCAP', 'SETUID', 'SYS_CHROOT']
  - name: offendingContainers
    expression: >-
      variables.allContainers.filter(c,
        c.?securityContext.?capabilities.?add.orValue([]).exists(cap, !(cap in variables.allowedCapabilities)))
  validations:
  - expression: size(variables.offendingContainers) == 0
    messageExpression: >-
      'Adding capabilities beyond the baseline set is disallowed: ' +
      variables.offendingContainers.map(c, c.name + ' (' +
        c.securityContext.capabilities.add.filter(cap, !(cap in variables.allowedCapabilities)).join(', ') +
        ')').join(', ')
