apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-host-namespaces
  annotations:
    policies.kyverno.io/title: Disallow Host Namespaces
    policies.kyverno.io/category: Pod Security Standards (Baseline)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Host namespaces (Process ID, IPC, Network) allow access to shared
      information and can be used to elevate privileges. Pods should not be
      allowed access to host namespaces. This policy ensures fields
      spec.hostNetwork, spec.hostIPC, and spec.hostPID are unset or set to false.
spec:
  validationActions: [Audit]
  failurePolicy: Ignore
  matchConstraints:
    # Kyverno's resourceFilters keep these out of admission checks, but not out of background scans
    namespaceSelector:
      matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: NotIn
        values: [kube-system, kyverno]
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["pods"]
  variables:
  - name: hostNamespaces
    expression: >-
      (object.spec.?hostPID.orValue(false) ? ['hostPID'] : []) +
      (object.spec.?hostIPC.orValue(false) ? ['hostIPC'] : []) +
      (object.spec.?hostNetwork.orValue(false) ? ['hostNetwork'] : [])
  validations:
  - expression: size(variables.hostNamespaces) == 0
    messageExpression: >-
      'Sharing host namespaces is disallowed: ' + variables.hostNamespaces.join(', ')
