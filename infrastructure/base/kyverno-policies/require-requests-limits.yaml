apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-requests-limits
  annotations:
    policies.kyverno.io/title: Require Requests and Limits
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Resource requests and limits are required to ensure workloads do not
      consume unbounded resources. This policy validates that all long-running
      containers, including native sidecars, have a memory request and a memory
      limit defined.
spec:
  validationActions: [Audit]
  failurePolicy: Ignore
  autogen:
    podControllers:
      controllers:
      - deployments
      - statefulsets
      - daemonsets
      - jobs
      - cronjobs
  matchConstraints:
    namespaceSelector:
      matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: NotIn
        values: [kube-system, kyverno]
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["pods"]
  variables:
  - name: longRunningContainers
    expression: >-
      object.spec.containers +
      object.spec.?initContainers.orValue([]).filter(c, c.?restartPolicy.orValue('') == 'Always')
  - name: missingResources
    expression: >-
      variables.longRunningContainers.filter(c, !(
        c.?resources.?requests[?'memory'].hasValue() &&
        c.?resources.?limits[?'memory'].hasValue()))
  validations:
  - expression: size(variables.missingResources) == 0
    messageExpression: >-
      'A memory request and a memory limit are required: ' +
      variables.missingResources.map(c, c.name).join(', ')
