admissionWebhooks:
  enabled: true
  # what to do in case, when operator not available to validate request.
  certManager:
    # enables cert creation and injection by cert-manager
    enabled: true
crds:
  enabled: true
  cleanup:
    enabled: true
resources:
  requests:
    cpu: 10m
    memory: 192Mi
  limits:
    memory: 320Mi
