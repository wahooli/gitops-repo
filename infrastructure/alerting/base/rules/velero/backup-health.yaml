apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: velero-backup-health
  namespace: alerting
spec:
  groups:
  - name: velero-backup-health
    rules:
    - alert: VeleroBackupFailed
      annotations:
        summary: Velero backup {{ $labels.name }} failed.
        description: Velero backup {{ $labels.name }} (schedule {{ $labels.schedule }}) is in phase {{ $labels.phase }}. Delete the backup once handled to resolve this alert.
      expr: |-
        kube_velero_backup_info{phase=~"Failed|FailedValidation"}
      for: 0m
      labels:
        severity: critical
    - alert: VeleroBackupPartialFailure
      annotations:
        summary: Velero backup {{ $labels.name }} partially failed.
        description: Velero backup {{ $labels.name }} (schedule {{ $labels.schedule }}) completed with errors. Delete the backup once handled to resolve this alert.
      expr: |-
        kube_velero_backup_info{phase="PartiallyFailed"}
      for: 0m
      labels:
        severity: warning
    - alert: VeleroBackupNotRunRecently
      annotations:
        summary: Velero backup schedule {{ $labels.schedule }} has not run recently.
        description: Velero schedule {{ $labels.schedule }} has not started a backup in the last 26 hours.
      expr: |-
        time() - kube_velero_schedule_last_backup_timestamp_seconds{schedule=~".*daily.*"} > 93600
      for: 0m
      labels:
        severity: critical
    - alert: VeleroBackupNotRunRecently
      annotations:
        summary: Velero backup schedule {{ $labels.schedule }} has not run recently.
        description: Velero schedule {{ $labels.schedule }} has not started a backup in the last 8 days.
      expr: |-
        time() - kube_velero_schedule_last_backup_timestamp_seconds{schedule=~".*weekly.*"} > 691200
      for: 0m
      labels:
        severity: critical
