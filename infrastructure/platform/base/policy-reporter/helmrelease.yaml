apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: policy-reporter--policy-reporter
  namespace: flux-system
spec:
  interval: 10m
  releaseName: policy-reporter
  chart:
    spec:
      version: "3.11.0"
  valuesFrom:
  - kind: ConfigMap
    name: policy-reporter-values
    valuesKey: values-base.yaml
  - kind: ConfigMap
    name: policy-reporter-values
    valuesKey: values-extra.yaml
    optional: true
