image:
  tag: v2.1.22 # {"$imagepolicy": "flux-system:zot:tag"}
service:
  annotations:
    service.cilium.io/global: "true"
    service.cilium.io/affinity: "local"
persistence: true
pvc:
  create: true
  accessModes:
  - ReadWriteOnce
  storage: 10Gi
externalSecrets:
- secretName: zot-credentials
  mountPath: /etc/zot/credentials
extraVolumeMounts:
- name: zot-config
  mountPath: /etc/zot/config.json
  subPath: config.json
resources:
  requests:
    memory: 96Mi
  limits:
    memory: 160Mi
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
