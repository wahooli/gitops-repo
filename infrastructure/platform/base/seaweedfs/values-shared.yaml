image:
  repository: chrislusf/seaweedfs
  tag: "4.48" # {"$imagepolicy": "flux-system:seaweedfs:tag"}
podAnnotations:
  secret.reloader.stakater.com/reload: "seaweedfs-shared"
  configmap.reloader.stakater.com/reload: "seaweedfs-shared-config"
defaultReplication: "000"
tls:
  enabled: true
  generateCertificates: true
  issuerRef:
    name: clustermesh-issuer
    kind: ClusterIssuer
master:
  containers:
    healthcheck:
      image:
        tag: "8.22.0"
      resources:
        requests:
          memory: 16Mi
        limits:
          memory: 48Mi
  replicaCount: 1
  resources:
    requests:
      memory: 48Mi
    limits:
      memory: 128Mi
volume:
  containers:
    healthcheck:
      image:
        tag: "8.22.0"
      resources:
        requests:
          memory: 16Mi
        limits:
          memory: 48Mi
  podManagementPolicy: Parallel
  cluster:
    ordinals:
      start: 0
    replicaCount: 5
  service:
    main:
      annotations:
        service.cilium.io/global: "true"
        service.cilium.io/global-sync-endpoint-slices: "true"
  persistence:
    data:
      spec:
        isPersistentVolumeClaim: true
        accessModes:
        - "ReadWriteOnce"
        resources:
          requests:
            storage: "5Gi"
  resources:
    requests:
      memory: 96Mi
    limits:
      memory: 1Gi
filer:
  containers:
    healthcheck:
      image:
        tag: "8.22.0"
      resources:
        requests:
          memory: 16Mi
        limits:
          memory: 48Mi
  replicaCount: 1
  service:
    lb:
      portsFrom: main
      annotations:
        service.cilium.io/global: "true"
        service.cilium.io/affinity: "local"
    nas:
      portsFrom: main
      annotations:
        service.cilium.io/global: "true"
        # service.cilium.io/affinity: "remote"
    tpi-1:
      portsFrom: main
      annotations:
        service.cilium.io/global: "true"
        # service.cilium.io/affinity: "local"
  args:
  - -dirListLimit=100000
  - -s3.config=/etc/seaweedfs/s3.json
  persistence:
    s3Config:
      mount:
      - path: /etc/seaweedfs/s3.json
        subPath: s3.json
      spec:
        configMap:
          name: seaweedfs-s3-config
          defaultMode: 0444
    data:
      spec:
        isPersistentVolumeClaim: true
        accessModes:
        - "ReadWriteOnce"
        resources:
          requests:
            storage: "6Gi"
  resources:
    requests:
      memory: 320Mi
    limits:
      memory: 512Mi
filerSync:
  __base__:
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
