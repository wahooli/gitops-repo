image:
  repository: chrislusf/seaweedfs-csi-driver
  tag: "v1.4.34" # {"$imagepolicy": "flux-system:seaweedfs-csi-driver:tag"}
tls:
  enabled: true
  existingSecret: seaweedfs-shared
seaweedfs:
  dataLocality: none
  filerAddress: seaweedfs-filer-lb.seaweedfs.svc.cluster.local:8888
podAnnotations:
  secret.reloader.stakater.com/reload: "seaweedfs-shared"
  configmap.reloader.stakater.com/reload: "seaweedfs-csi-driver-shared-config"
nodeGc:
  image:
    repository: ghcr.io/wahooli/docker/kubectl
    tag: 0.0.1 # {"$imagepolicy": "flux-system:kubectl-docker:tag"}
  enabled: true
controller:
  containers:
    csi-attacher:
      resources:
        requests:
          cpu: 10m
          memory: 48Mi
        limits:
          memory: 96Mi
    csi-liveness-probe:
      resources:
        requests:
          cpu: 10m
          memory: 24Mi
        limits:
          memory: 64Mi
    csi-provisioner:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 96Mi
    csi-resizer:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 96Mi
  resources:
    requests:
      cpu: 10m
      memory: 48Mi
    limits:
      memory: 96Mi
node:
  containers:
    csi-liveness-probe:
      resources:
        requests:
          cpu: 10m
          memory: 24Mi
        limits:
          memory: 64Mi
    driver-registrar:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi
  resources:
    requests:
      cpu: 10m
      memory: 48Mi
    limits:
      memory: 96Mi
