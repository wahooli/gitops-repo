# Infrastructure that needs host access by design: CSI drivers, the LVM daemon,
# log collectors, the backup node agent and the seaweedfs backup job (FUSE mount).
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: infrastructure-host-access
  namespace: kyverno
spec:
  policyRefs:
  - name: disallow-host-path
    kind: ValidatingPolicy
  - name: disallow-capabilities
    kind: ValidatingPolicy
  - name: disallow-privileged-containers
    kind: ValidatingPolicy
  - name: disallow-host-namespaces
    kind: ValidatingPolicy
  matchConditions:
  # Matches on pod labels, read from the pod template when the policy is applied to a
  # controller. [x].exists(name, ...) binds x to a name: cel.bind isn't available here.
  - name: infrastructure-workload
    expression: >-
      [object.?spec.?template.?metadata.?labels.orValue(
        object.?spec.?jobTemplate.?spec.?template.?metadata.?labels.orValue(
          object.metadata.?labels.orValue({})))
      ].exists(labels,
        (object.metadata.namespace == 'crowdsec' &&
          labels[?'type'].orValue('') == 'agent') ||
        (object.metadata.namespace == 'logging' &&
          labels[?'app.kubernetes.io/instance'].orValue('') == 'vector-agent') ||
        (object.metadata.namespace == 'seaweedfs' &&
          labels[?'app.kubernetes.io/instance'].orValue('') == 'seaweedfs-csi-driver') ||
        (object.metadata.namespace == 'seaweedfs' &&
          labels[?'app.kubernetes.io/component'].orValue('') == 'backup') ||
        (object.metadata.namespace == 'topolvm-system' &&
          labels[?'app.kubernetes.io/instance'].orValue('') == 'topolvm') ||
        (object.metadata.namespace == 'velero' &&
          labels[?'role'].orValue('') == 'node-agent'))
