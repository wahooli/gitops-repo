image:
  repository: chrislusf/seaweedfs
  tag: "4.48" # {"$imagepolicy": "flux-system:seaweedfs:tag"}
fullNameOverride: seaweedfs-backup
master:
  replicaCount: 1
  resources:
    requests:
      memory: 128Mi
    limits:
      memory: 256Mi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
volume:
  replicaCount: 1
  args:
  - -dir=/data
  - -max=0
  - -compactionMBps=50
  - -readMode=proxy
  - -minFreeSpacePercent=7
  persistence:
    data:
      spec:
        isPersistentVolumeClaim: true
        storageClassName: ""
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 1Ti
  resources:
    requests:
      memory: 160Mi
    limits:
      memory: 384Mi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
postUp:
  enabled: true
  collections:
  - name: seaweedfs-backups
  - name: nas-backups
  - name: tpi-1-backups
  - name: livingroom-pi-backups
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
  resources:
    requests:
      memory: 32Mi
    limits:
      memory: 128Mi
  env:
    HOME: /tmp
filer:
  replicaCount: 1
  podAnnotations:
    secret.reloader.stakater.com/reload: "seaweedfs-s3-secret"
  args:
  - -dirListLimit=100000
  - -s3
  - -s3.config=/etc/seaweedfs/s3.json
  service:
    lb:
      annotations:
        service.cilium.io/global: "true"
  persistence:
    s3-config:
      mount:
      - path: /etc/seaweedfs/s3.json
        subPath: seaweedfs_s3_config
      spec:
        secret:
          secretName: seaweedfs-s3-secret
          defaultMode: 0444
    data:
      spec:
        isPersistentVolumeClaim: true
        storageClassName: ""
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 1Ti
  resources:
    requests:
      memory: 1Gi
    limits:
      memory: 5Gi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
