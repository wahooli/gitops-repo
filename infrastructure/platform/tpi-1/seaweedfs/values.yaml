rack: tpi-1

master:
  # With -max=0 a volume server gets a volume slot for each volumeSizeLimitMB of free disk. The chart's 30000MB left the
  # 100Gi volume disks only a few slots each, all used up by mostly empty volumes.
  args:
  - -mdir=/data
  - -volumeSizeLimitMB=5000
  configMaps:
    config:
      data:
        master.toml: |-
          # volumes created at a time for a collection that has none writable, by number of copies (default 7, 6, 3, 1)
          [master.volume_growth]
          copy_1 = 2
          copy_2 = 2
          copy_3 = 1
          copy_other = 1

          [master.maintenance]
          scripts = """
            lock
            ec.encode -fullPercent=95 -quietFor=1h -collection=zot-registry
            ec.rebuild -force -collection=zot-registry
            ec.balance -force -collection=zot-registry
            volume.configure.replication -collectionPattern "forgejo-s3-data" -replication 001
            volume.deleteEmpty -quietFor=72h -force
            volume.balance -force
            volume.fix.replication -force
            s3.clean.uploads -timeAgo=24h
            unlock
          """
          sleep_minutes = 17

          [master.sequencer]
          type = "raft"
          sequencer_snowflake_id = 0
  persistence:
    master-config:
      mount:
      - path: /etc/seaweedfs/master.toml
        subPath: master.toml
      spec:
        useFromChart: true
        configMap:
          name: config
          defaultMode: 0444

volume:
  replicaCount: 4
  ordinals:
    start: 0
  # the base args, with more free space kept: 1% of a 100Gi disk is 1GB
  args:
  - -dir=/data
  - -max=0
  - -compactionMBps=50
  - -readMode=proxy
  - -publicUrl=$(POD_FQDN)
  - -minFreeSpacePercent=5
  persistence:
    data:
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 100Gi

postUp:
  enabled: true
  collections:
  - name: forgejo-s3-data
    replication: "001"
  - name: zot-registry

filer:
  service:
    lb:
      annotations:
        service.cilium.io/global: "true"
        service.cilium.io/affinity: "local"
    nas:
      omitSelector: true
      annotations:
        service.cilium.io/global: "true"
        service.cilium.io/affinity: "remote"
    tpi-1:
      annotations:
        service.cilium.io/global: "true"
        service.cilium.io/affinity: "local"
